[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jdy-feishu-sync"
version = "0.1.0"
description = "Read-only Jiandaoyun integration for the Feishu sync project"
requires-python = ">=3.11"
dependencies = ["httpx>=0.25", "python-dotenv>=1.0", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
jdy-sync = "jdy_feishu_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
